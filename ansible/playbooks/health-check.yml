---
- name: InfraPilot - Docker Health Check
  hosts: local
  gather_facts: false

  tasks:
    - name: Check Nginx container
      ansible.builtin.command:
        cmd: docker inspect --format={{ '{{' }}.State.Status{{ '}}' }} infrapilot-nginx
      register: nginx_status
      changed_when: false
      failed_when: false

    - name: Check Nagios container
      ansible.builtin.command:
        cmd: docker inspect --format={{ '{{' }}.State.Status{{ '}}' }} infrapilot-nagios
      register: nagios_status
      changed_when: false
      failed_when: false

    - name: Display container health report
      ansible.builtin.debug:
        msg:
          - "Nginx Status: {{ nginx_status.stdout | default('Not Found') }}"
          - "Nagios Status: {{ nagios_status.stdout | default('Not Found') }}"