---
- name: InfraPilot - Automated Nginx Deployment
  hosts: local
  gather_facts: false

  tasks:
    - name: Check whether InfraPilot Nginx container exists
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Status{{ '}}' }}"
          - infrapilot-nginx
      register: nginx_status
      changed_when: false
      failed_when: false

    - name: Stop if Nginx container does not exist
      ansible.builtin.fail:
        msg: "infrapilot-nginx container not found. Start it through Docker Compose first."
      when: nginx_status.rc != 0

    - name: Start Nginx if it is stopped
      ansible.builtin.command:
        argv:
          - docker
          - start
          - infrapilot-nginx
      when: nginx_status.stdout | trim != "running"

    - name: Verify Nginx container status
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Status{{ '}}' }}"
          - infrapilot-nginx
      register: final_nginx_status
      changed_when: false

    - name: Confirm deployment
      ansible.builtin.debug:
        msg: "InfraPilot Nginx status: {{ final_nginx_status.stdout }}"
