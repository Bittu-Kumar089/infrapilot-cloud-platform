---
- name: InfraPilot - Restart and Verify Services
  hosts: local
  gather_facts: false

  tasks:
    - name: Check Frontend container exists
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - infrapilot-nginx
      register: frontend_exists
      changed_when: false
      failed_when: false

    - name: Stop if Frontend container does not exist
      ansible.builtin.fail:
        msg: "Frontend container infrapilot-nginx was not found."
      when: frontend_exists.rc != 0

    - name: Restart Frontend container
      ansible.builtin.command:
        argv:
          - docker
          - restart
          - infrapilot-nginx
      register: frontend_restart
      changed_when: frontend_restart.rc == 0

    - name: Wait for Frontend to initialize
      ansible.builtin.pause:
        seconds: 5

    - name: Verify Frontend container
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Status{{ '}}' }}"
          - infrapilot-nginx
      register: frontend_status
      changed_when: false

    - name: Verify Backend container
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Status{{ '}}' }}"
          - infrapilot-backend
      register: backend_status
      changed_when: false

    - name: Display restart report
      ansible.builtin.debug:
        msg:
          - "Frontend Status: {{ frontend_status.stdout }}"
          - "Backend Status: {{ backend_status.stdout }}"

    - name: Fail if required services are not running
      ansible.builtin.fail:
        msg: "Service verification failed after restart."
      when: >-
        frontend_status.stdout | trim != 'running' or
        backend_status.stdout | trim != 'running'
